# cg-graphify-bridge — CI builds the deterministic structural graph and commits it onto the
# PULL REQUEST'S OWN BRANCH, so code + structural.json review and merge together in ONE PR.
#
# Why this shape (build-on-PR-branch, not a post-merge bot PR):
#   * structural is correct AT MERGE time — no stale window, no second PR, no auto-merge dance.
#   * loop-safe by construction: the structural commit touches only graphify-out/**, which is
#     NOT a trigger path below, so it never re-runs this workflow. And even if it did, a
#     deterministic rebuild is byte-identical, so the diff-gated push step is a no-op.
#
# CI is the SINGLE Leiden builder (install the [leiden] extra). Devs run a light Louvain build
# locally only for the semantic overlay; they never rebuild structural by hand.
#
# NOTE: fork PRs can't be pushed to (GITHUB_TOKEN has no write to forks) — the push step is
# guarded to same-repo PRs; a fork-PR check-only fallback is a future addition.
name: graph-build

on:
  workflow_dispatch: {}                # manual trigger — on-demand rebuild / CI validation
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infra/**'
      - 'src/**'
  push:
    branches: [main]                   # this repo pushes straight to main (unprotected) → rebuild + commit-back on main
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infra/**'
      - 'src/**'

permissions:
  contents: write        # push the structural update back onto the PR's head branch

env:
  # Run the JS actions (checkout/setup-*) on Node 24 — GitHub forces this 2026-06-16; opt in now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: graph-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}   # the PR's source branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Install the tool from its public repo, pinned to a tag for reproducible structural builds.
      # Bump the tag deliberately when you adopt a new tool version.
      # self-host: build with THIS checkout (base install = Louvain, matching the committed engine stamp)
      - run: pip install "."
      # TS substrate uses the TARGET repo's typescript; codegraph covers other languages.
      - run: if [ -f package.json ]; then npm ci --legacy-peer-deps; fi
      - run: npm i -g @colbymchenry/codegraph@0.9.9 || true   # PINNED: substrate version is stamped + drift-checked
      - name: Build structural graph (the tool pins PYTHONHASHSEED -> byte-deterministic)
        run: cg-graphify-bridge build . --out graphify-out
      # Versioned, beautiful showcase at the repo root (content-deterministic -> rides the diff-gate).
      - name: Render insights showcase (GRAPH_INSIGHTS.md)
        run: cg-graphify-bridge insights . --out-file GRAPH_INSIGHTS.md
      - name: Commit + push ONLY if structural changed (diff-gated = loop backstop)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          CG_GRAPH_COMMIT_MSG: ${{ vars.CG_GRAPH_COMMIT_MSG }}   # optional repo-variable override
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          layers="graphify-out/structural.json graphify-out/GRAPH_REPORT.md graphify-out/.cg_manifest.json GRAPH_INSIGHTS.md"
          if git diff --quiet -- $layers; then
            echo "structural unchanged — deterministic rebuild, nothing to push."; exit 0
          fi
          # Reuse the LAST commit's conventional type so the bot commit passes the repo's commitlint
          # type-enum ('ci' is often disallowed); override the whole message with the CG_GRAPH_COMMIT_MSG var.
          TYPE=$(git log -1 --format=%s | sed -nE 's/^([A-Za-z]+)(\([^)]*\))?!?:.*/\1/p')
          MSG="${CG_GRAPH_COMMIT_MSG:-${TYPE:+$TYPE: }ci graph build}"
          git add $layers
          git commit -m "$MSG"
          if ! git push origin "HEAD:${{ github.head_ref || github.ref_name }}"; then
            echo "::error::cg-graphify-bridge: structural commit-back rejected — likely branch protection (required status checks / signed commits) or a read-only GITHUB_TOKEN. Relax that rule for the PR branch, or build structural locally and commit it in the PR." >&2
            exit 1
          fi
      # OPT-IN, NON-BLOCKING health advisory: set repo variable CG_HEALTH_ADVISORY=true to surface
      # structural+semantic+combined health drift in the run summary. Never gates the build.
      - name: Health advisory (opt-in; never blocks)
        if: ${{ vars.CG_HEALTH_ADVISORY == 'true' }}
        continue-on-error: true
        run: cg-graphify-bridge health . --out graphify-out >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

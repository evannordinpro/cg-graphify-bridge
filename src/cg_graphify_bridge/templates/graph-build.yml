# cg-graphify-bridge — CI rebuilds the deterministic structural graph and commits it onto the
# PULL REQUEST'S OWN BRANCH, so code + structural.json review and merge together in ONE PR.
#
# Why this shape (build-on-PR-branch):
#   * structural is correct AT MERGE time — no stale window, no second PR, no auto-merge dance.
#   * minimal dependency: the built-in GITHUB_TOKEN (contents: write) — NO PAT, no app, no managed bot.
#   * loop-safe: GITHUB_TOKEN pushes don't re-trigger workflows, and the structural commit touches
#     only graphify-out/** (not a trigger path); a deterministic rebuild is byte-identical anyway.
#   * the bot commit reuses the LAST commit's conventional type, so it passes commitlint type-enums.
#
# Limits (the commit-back fails LOUDLY with guidance when it can't push):
#   * required status checks + "require branches up to date": GITHUB_TOKEN pushes don't re-trigger
#     checks, so the bot commit's SHA has no runs and merge is blocked. Exclude this job from that
#     rule, or build structural locally and commit it in the PR.
#   * required SIGNED commits, or a read-only GITHUB_TOKEN org default: the bot can't commit.
#   * fork PRs: GITHUB_TOKEN can't write to a fork; the push step is guarded to skip them.
#
# CI is the SINGLE structural builder (the [leiden] extra -> Leiden; otherwise base/Louvain). Devs
# never rebuild structural by hand — they only refresh the semantic overlay (see AGENTS.md).
name: graph-build

on:
  workflow_dispatch: {}                # manual trigger — on-demand rebuild / validation
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infra/**'
      - 'src/**'
  push:
    branches-ignore: [main, develop]   # feature-branch pushes only; protected branches merge via PR
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infra/**'
      - 'src/**'

permissions:
  contents: write        # push the structural update back onto the PR's head branch

env:
  # Run the JS actions (checkout/setup-*) on Node 24 — GitHub forces this 2026-06-16; opt in now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: graph-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}   # the PR's source branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Install the tool from its public repo, pinned to a tag for reproducible structural builds.
      # Bump the tag deliberately when you adopt a new tool version.
      - run: pipx install "git+https://github.com/evannordinpro/cg-graphify-bridge@v0.1.0#egg=cg-graphify-bridge[leiden]"
      # TS substrate uses the TARGET repo's typescript; codegraph covers other languages.
      - run: if [ -f package.json ]; then npm ci --legacy-peer-deps; fi
      - run: npm i -g @colbymchenry/codegraph@0.9.9 || true   # PIN the substrate version (it's stamped + drift-checked); bump deliberately
      - name: Build structural graph (the tool pins PYTHONHASHSEED -> byte-deterministic)
        run: cg-graphify-bridge build . --out graphify-out
      # OPT-IN versioned showcase: set repo variable CG_INSIGHTS=true to render + commit a beautiful
      # GRAPH_INSIGHTS.md at the repo root (content-deterministic -> rides the diff-gate).
      - name: Render insights showcase (opt-in -> GRAPH_INSIGHTS.md)
        if: ${{ vars.CG_INSIGHTS == 'true' }}
        run: cg-graphify-bridge insights . --out-file GRAPH_INSIGHTS.md
      # OPT-IN versioned FAQ: set repo variable CG_FAQ=true to render + commit PROJECT_FAQ.md at the
      # repo root (deterministic facts + the committed faq.json narrative; LLM-free in CI).
      - name: Render PROJECT_FAQ.md (opt-in)
        if: ${{ vars.CG_FAQ == 'true' }}
        run: cg-graphify-bridge faq-render . --out-file PROJECT_FAQ.md
      - name: Commit + push ONLY if structural changed (diff-gated = loop backstop)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          CG_GRAPH_COMMIT_MSG: ${{ vars.CG_GRAPH_COMMIT_MSG }}   # optional: set this repo variable to override the bot commit message
          CG_INSIGHTS: ${{ vars.CG_INSIGHTS }}
          CG_FAQ: ${{ vars.CG_FAQ }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          layers="graphify-out/structural.json graphify-out/GRAPH_REPORT.md graphify-out/.cg_manifest.json"
          if [ "${CG_INSIGHTS}" = "true" ] && [ -f GRAPH_INSIGHTS.md ]; then layers="$layers GRAPH_INSIGHTS.md"; fi
          if [ "${CG_FAQ}" = "true" ] && [ -f PROJECT_FAQ.md ]; then layers="$layers PROJECT_FAQ.md"; fi
          if git diff --quiet -- $layers; then
            echo "structural unchanged — deterministic rebuild, nothing to push."; exit 0
          fi
          # Reuse the LAST commit's conventional type so the bot commit passes the repo's commitlint
          # type-enum ('ci' is often disallowed); override the whole message with the CG_GRAPH_COMMIT_MSG var.
          TYPE=$(git log -1 --format=%s | sed -nE 's/^([A-Za-z]+)(\([^)]*\))?!?:.*/\1/p')
          MSG="${CG_GRAPH_COMMIT_MSG:-${TYPE:+$TYPE: }ci graph build}"
          git add $layers
          git commit -m "$MSG"
          if ! git push origin "HEAD:${{ github.head_ref || github.ref_name }}"; then
            echo "::error::cg-graphify-bridge: structural commit-back rejected — likely branch protection (required status checks / signed commits) or a read-only GITHUB_TOKEN. Relax that rule for the PR branch, or build structural locally and commit it in the PR." >&2
            exit 1
          fi
      # OPT-IN, NON-BLOCKING health advisory: set repo variable CG_HEALTH_ADVISORY=true to surface
      # structural+semantic+combined health drift in the run summary. Never gates the build.
      - name: Health advisory (opt-in; never blocks)
        if: ${{ vars.CG_HEALTH_ADVISORY == 'true' }}
        continue-on-error: true
        run: cg-graphify-bridge health . --out graphify-out >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
